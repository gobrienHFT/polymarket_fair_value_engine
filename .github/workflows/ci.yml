name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Test
        run: pytest -q
      - name: Verify committed artifacts
        run: python scripts/verify_committed_artifacts.py
      - name: Verify sample-output reproducibility
        run: |
          python scripts/refresh_sample_outputs.py
          git diff --exit-code -- docs/sample_outputs
